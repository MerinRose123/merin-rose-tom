<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merin Rose Tom</title>
<meta name="description" content="Portfolio" />
<link rel="icon" type="image/png" href="assets/images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- Content: one file per section in /data -->
<script src="data/site.js"></script>
<script src="data/hero.js"></script>
<script src="data/about.js"></script>
<script src="data/experience.js"></script>
<script src="data/skills.js"></script>
<script src="data/projects.js"></script>
<script src="data/blogs.js"></script>
<script src="data/achievements.js"></script>
<script src="data/hobbies.js"></script>
<script src="data/contact.js"></script>
<style>
:root{
  --bg:#080a0d; --bg2:#11151b; --card:rgba(255,255,255,.04); --card-b:rgba(255,255,255,.09);
  --text:#ecebf5; --muted:#9a99b0; --a1:#64748b; --a2:#0ea5e9; --a3:#94a3b8; --a4:#38bdf8;
  --a1-rgb:100,116,139; --a2-rgb:14,165,233; --a3-rgb:148,163,184;
  --grad:linear-gradient(120deg,var(--a1),var(--a2) 50%,var(--a3));
  --radius:20px; --glass:rgba(14,14,24,.65);
  --hf:"Space Grotesk",system-ui,sans-serif; --bf:Inter,system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f5f7fa; --bg2:#ffffff; --card:rgba(255,255,255,.8); --card-b:rgba(20,10,60,.09);
  --text:#16142a; --muted:#5d5a78; --glass:rgba(255,255,255,.75);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--bf);background:var(--bg);color:var(--text);line-height:1.65;overflow-x:clip;transition:background .4s,color .4s}
h1,h2,h3,h4,h5{font-family:var(--hf);line-height:1.15;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{max-width:100%;display:block}
.container{width:min(1180px,100% - 32px);margin-inline:auto}
section{padding:80px 0;position:relative}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- scrollbar & text selection (follow the active palette) ---------- */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--a1),var(--a2));border-radius:999px;border:3px solid var(--bg);min-height:48px}
::-webkit-scrollbar-thumb:hover{border-width:2px}
::-webkit-scrollbar-thumb:active{background:linear-gradient(180deg,var(--a2),var(--a1))}
::-webkit-scrollbar-corner{background:var(--bg)}
.d-scroll::-webkit-scrollbar{width:7px}
.d-scroll::-webkit-scrollbar-track{background:transparent}
.d-scroll::-webkit-scrollbar-thumb{border:2px solid var(--bg2)}
@supports not selector(::-webkit-scrollbar){html,.d-scroll{scrollbar-width:thin;scrollbar-color:var(--a1) var(--bg)}}
::selection{background:rgba(var(--a2-rgb),.35);color:var(--text)}

/* ---------- background ---------- */
.bg-blobs{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.26}
.blob.b1{background:var(--a1);top:-120px;left:-120px;animation:f1 18s ease-in-out infinite}
.blob.b2{background:var(--a2);bottom:-160px;right:-120px;animation:f2 22s ease-in-out infinite}
.blob.b3{background:var(--a3);top:40%;left:45%;width:380px;height:380px;opacity:.16;animation:f1 26s ease-in-out infinite reverse}
[data-theme="light"] .blob{opacity:.16}
@keyframes f1{50%{transform:translate(120px,80px) scale(1.15)}}
@keyframes f2{50%{transform:translate(-140px,-60px) scale(.9)}}
.grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--card-b) 1px,transparent 1px),linear-gradient(90deg,var(--card-b) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);opacity:.5}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:grid;place-items:center}
#loader .l-text{font:700 clamp(40px,8vw,80px)/1 var(--hf);overflow:hidden}
#loader .l-text span{display:inline-block;transform:translateY(110%)}
#loader .bar{width:160px;height:2px;background:var(--card-b);margin:22px auto 0;overflow:hidden;border-radius:2px}
#loader .bar i{display:block;height:100%;width:0;background:var(--grad)}

/* ---------- cursor (dot + trailing ring) ---------- */
.c-dot,.c-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:998;opacity:0;transition:opacity .3s}
.c-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--a2)}
.c-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid rgba(var(--a1-rgb),.65);transition:opacity .3s,width .25s,height .25s,margin .25s,background .25s,border-color .25s}
.c-ring.hover{width:56px;height:56px;margin:-28px 0 0 -28px;background:rgba(var(--a1-rgb),.12);border-color:rgba(var(--a2-rgb),.5)}
.c-ring.down{width:24px;height:24px;margin:-12px 0 0 -12px}
body.c-on .c-dot,body.c-on .c-ring{opacity:1}
@media (hover:none){.c-dot,.c-ring{display:none}}

/* ---------- top bar ---------- */
#progress{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--grad);transform-origin:0 50%;transform:scaleX(0);z-index:100}
.topbar{position:fixed;top:16px;left:0;right:0;z-index:90;pointer-events:none}
.topbar .container{display:flex;justify-content:space-between;align-items:center}
.topbar>*>*{pointer-events:auto}
.logo{font:700 20px var(--hf);padding:9px 18px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--card-b)}
.logo b{color:var(--a2)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--card-b);background:var(--glass);backdrop-filter:blur(14px);cursor:pointer;transition:transform .3s}
.icon-btn:hover{transform:rotate(25deg)}
.icon-btn svg{width:18px;height:18px}

/* ---------- theme & colour picker ---------- */
#rg stop:nth-child(1){stop-color:var(--a1)}#rg stop:nth-child(2){stop-color:var(--a2)}#rg stop:nth-child(3){stop-color:var(--a3)}
.look{position:relative}
.look-panel{position:absolute;top:calc(100% + 10px);right:0;width:280px;padding:16px;border-radius:20px;background:var(--bg2);border:1px solid var(--card-b);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1);z-index:120}
.look-panel.open{opacity:1;transform:none;pointer-events:auto}
.look-panel h6{font:600 11px var(--bf);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--card-b);margin-bottom:16px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 13px var(--bf);cursor:pointer;transition:.2s}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;cursor:pointer;color:var(--muted);font:500 11px var(--bf)}
.sw i{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg2);transition:transform .25s,border-color .25s}
.sw:hover i{transform:scale(1.08)}
.sw.on i{border-color:var(--text)}
.sw.on{color:var(--text)}
.look-now{margin-top:14px;padding-top:12px;border-top:1px solid var(--card-b);font-size:12px;color:var(--muted)}
.look-now b{color:var(--text);font-weight:600}
@media(max-width:400px){.look-panel{width:calc(100vw - 32px)}}

/* ---------- dock (fixed bottom nav) ---------- */
.dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:95;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--card-b);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.dock a{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);transform-origin:bottom center;transition:transform .18s ease-out,color .25s,background .25s}
.dock a svg{width:20px;height:20px}
.dock a:hover{color:var(--text);background:var(--card)}
.dock a.active{color:#fff;background:var(--grad)}
.dock a::after{content:attr(data-label);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,6px);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--text);color:var(--bg);opacity:0;pointer-events:none;transition:.2s}
.dock a:hover::after{opacity:1;transform:translate(-50%,0)}
.dock .sep{width:1px;height:28px;background:var(--card-b);margin:0 4px 8px}
.dock .lbl,.dock .more,.menu-sheet{display:none}
/* phones: tab bar (4 main sections + Menu) and a pop-up grid with every section */
@media(max-width:640px){
  .dock{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));transform:none;max-width:none;justify-content:space-between;align-items:stretch;gap:4px;padding:6px;border-radius:22px;background:var(--bg2)}
  .dock a.x,.dock .sep{display:none}
  .dock a,.dock .more{flex:1;width:auto;height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);border:0;background:transparent;cursor:pointer}
  .dock a svg,.dock .more svg{width:20px;height:20px}
  .dock .lbl{display:block;font:500 10.5px/1 var(--bf)}
  .dock a::after{display:none}
  .dock a.active,.dock .more.active,.dock .more.open{color:var(--text);background:rgba(var(--a1-rgb),.16)}
  .dock a.active svg,.dock .more.active svg{color:var(--a2)}
  .menu-sheet{display:grid;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:94;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:22px;background:var(--bg2);border:1px solid var(--card-b);box-shadow:0 -10px 50px -10px rgba(0,0,0,.6);opacity:0;transform:translateY(16px) scale(.97);transform-origin:bottom center;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
  .menu-sheet.open{opacity:1;transform:none;pointer-events:auto}
  .menu-sheet a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:14px;font-size:12px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--card-b)}
  .menu-sheet a svg{width:20px;height:20px}
  .menu-sheet a:last-child{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;padding:13px;font-size:13.5px;color:var(--text);border-color:rgba(var(--a1-rgb),.4)}
  .menu-sheet a.active{color:#fff;background:var(--grad);border-color:transparent}
  .menu-scrim{position:fixed;inset:0;z-index:93;background:rgba(5,5,10,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
  .menu-scrim.open{opacity:1;pointer-events:auto}
}
@media(max-width:360px){.dock .lbl{display:none}.dock a,.dock .more{height:46px}.menu-sheet{grid-template-columns:1fr 1fr;bottom:calc(76px + env(safe-area-inset-bottom))}}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;overflow:hidden;isolation:isolate;transition:transform .2s;border:0;cursor:pointer}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 40px -10px rgba(var(--a1-rgb),.6)}
.btn-ghost{border:1px solid var(--card-b);background:var(--card)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35),transparent 70%);transform:translateX(-120%);transition:transform .7s;z-index:-1}
.btn:hover::after{transform:translateX(120%)}
.btn svg{width:18px;height:18px}

/* ---------- hero (fits viewport) ---------- */
#home{height:100vh;height:100svh;min-height:560px;padding:84px 0 96px;display:flex;align-items:center;overflow:clip}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;border:1px solid var(--card-b);background:var(--card);font-size:13px;color:var(--muted);margin-bottom:18px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 10px transparent}}
.hero h1{font-size:clamp(32px,4.2vw,58px);font-weight:700;margin-bottom:12px}
.hero h1 .word{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.hero h1 .word span{display:inline-block}
.roles{font:500 clamp(16px,1.8vw,22px) var(--hf);color:var(--muted);min-height:1.5em;margin-bottom:16px}
.roles .typed{color:var(--text)}
.roles .caret{display:inline-block;width:2px;height:1em;background:var(--a2);margin-left:4px;vertical-align:-3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.hero p.lead{color:var(--muted);font-size:16.5px;max-width:520px;margin-bottom:26px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.socials{display:flex;gap:10px;margin-top:26px}
.socials a{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--card-b);background:var(--card);transition:transform .3s,border-color .3s,background .3s}
.socials a:hover{transform:translateY(-5px) rotate(-6deg);border-color:var(--a1);background:rgba(var(--a1-rgb),.14)}
.socials svg{width:19px;height:19px}
.hero-visual{position:relative;width:min(360px,50vh,100%);aspect-ratio:1;justify-self:center}
.hv-tilt{position:absolute;inset:0}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--a1),var(--a2),var(--a3),var(--a1));animation:spin 8s linear infinite}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:absolute;inset:14px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hero-visual:hover .avatar img{transform:scale(1.06)}
.avatar .glare{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.28),transparent 45%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s;pointer-events:none}
.hero-visual:hover .avatar .glare{opacity:1}
/* tech-stack row under the hero text */
.stack{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.stack-label{font:600 11px var(--bf);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stack-icons{display:flex;gap:10px;flex-wrap:wrap}
.stack-ic{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;padding:8px;background:var(--bg2);border:1px solid var(--card-b);transition:transform .3s cubic-bezier(.3,1.6,.5,1),border-color .3s,box-shadow .3s}
.stack-ic img{width:100%;height:100%;object-fit:contain}
.stack-ic:hover,.stack-ic:focus-visible{transform:translateY(-4px);border-color:rgba(var(--a2-rgb),.6);box-shadow:0 10px 24px -10px rgba(var(--a2-rgb),.6);outline:none}
.stack-ic::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translate(-50%,5px);padding:5px 10px;border-radius:8px;white-space:nowrap;font:600 12px var(--bf);background:var(--text);color:var(--bg);opacity:0;pointer-events:none;transition:.2s}
.stack-ic::before{content:"";position:absolute;bottom:calc(100% + 0px);left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--text);opacity:0;transition:.2s;pointer-events:none}
.stack-ic:hover::after,.stack-ic:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.stack-ic:hover::before,.stack-ic:focus-visible::before{opacity:1}
@media(max-width:900px){
  #home{height:auto;min-height:100svh;padding:90px 0 110px}
  .hero{grid-template-columns:1fr;gap:34px}
  .hero-visual{width:min(230px,58vw);order:-1;justify-self:center;margin-top:8px}
  .stack-ic{width:38px;height:38px;padding:7px}}

/* ---------- highlights strip ---------- */
.strip{padding:26px 0;border-block:1px solid var(--card-b);background:var(--card)}
.strip-in{display:flex;align-items:center;gap:28px}
.strip-label{flex-shrink:0;font:600 12px var(--bf);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-right:28px;border-right:1px solid var(--card-b);line-height:1.5}
.strip-view{flex:1;min-width:0;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.strip-track{display:flex;width:max-content;will-change:transform}
.strip-view.dragging{cursor:grabbing}
.strip-view.dragging .pill{transform:none}
.strip-group{display:flex;gap:12px;padding-right:12px}
.pill{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;border:1px solid var(--card-b);background:var(--bg2);font:500 14px var(--bf);white-space:nowrap;transition:border-color .3s,transform .3s}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grad)}
.pill:hover{border-color:rgba(var(--a1-rgb),.5);transform:translateY(-2px)}
@media(max-width:640px){.strip{padding:20px 0}.strip-in{flex-direction:column;align-items:flex-start;gap:14px}.strip-label{border:0;padding:0}.strip-view{width:100%}.pill{font-size:13px;padding:8px 14px}}
@keyframes marquee{to{transform:translateX(-50%)}}

/* ---------- section heads / cards ---------- */
.sec-head{margin-bottom:40px}
.sec-tag{font:500 13px var(--bf);letter-spacing:.25em;text-transform:uppercase;color:var(--a2);display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sec-tag::before{content:"";width:34px;height:1px;background:var(--a2)}
.sec-head h2{font-size:clamp(32px,4.6vw,56px)}
.reveal{opacity:0;transform:translateY(46px)}
.card{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:26px;overflow:hidden;backdrop-filter:blur(10px);transition:border-color .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.spot::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(var(--a1-rgb),.18),transparent 40%);opacity:0;transition:opacity .3s;pointer-events:none}
.spot:hover::before{opacity:1}
.spot:hover{border-color:rgba(var(--a1-rgb),.45)}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}
.about-text p{color:var(--muted);font-size:16.5px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.stat h4{font-size:clamp(28px,7vw,44px)}
.stat p{color:var(--muted);font-size:14px}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.service .num{font:700 14px var(--hf);color:var(--a2);margin-bottom:26px}
.service h4{font-size:20px;margin-bottom:10px}
.service p{color:var(--muted);font-size:15px}
.service:hover{transform:translateY(-6px)}
@media(max-width:900px){.about-grid,.services{grid-template-columns:1fr}}

/* ---------- experience ---------- */
.timeline{position:relative;padding-left:48px}
.tl-line{position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--card-b)}
.tl-line i{position:absolute;inset:0;background:var(--grad);transform-origin:top;transform:scaleY(0)}
.tl-item{position:relative;margin-bottom:24px}
.tl-dot{position:absolute;left:-42px;top:30px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--a1);transition:background .3s,box-shadow .3s}
.tl-item.on .tl-dot{background:var(--a2);box-shadow:0 0 0 6px rgba(var(--a2-rgb),.18)}
.tl-item .card{cursor:pointer}
.tl-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tl-head h4{font-size:21px}
.tl-where{color:var(--a3);font-weight:500;margin-top:4px}
.tl-date{font-size:13px;color:var(--muted);padding:6px 12px;border:1px solid var(--card-b);border-radius:999px;height:fit-content;white-space:nowrap}
.tl-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s ease}
.tl-item.open .tl-body{grid-template-rows:1fr}
.tl-body>div{overflow:hidden}
.tl-body ul{list-style:none;padding-top:16px}
.tl-body li{position:relative;padding-left:22px;color:var(--muted);margin-bottom:9px;font-size:15px}
.tl-body li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:8px;border-radius:2px;background:var(--grad);transform:rotate(45deg)}
.toggle{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--a1);font-weight:600}
.toggle svg{width:14px;transition:transform .3s}
.tl-item.open .toggle svg{transform:rotate(180deg)}

/* ---------- skills ---------- */
.logo-rows{display:flex;flex-direction:column;gap:14px;margin-bottom:32px;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-view{overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:4px 0}
.mq-view.dragging{cursor:grabbing}
.mq-track{display:flex;width:max-content;will-change:transform}
.mq-group{display:flex;gap:14px;padding-right:14px}
.mq-view.dragging .chip{transform:none}
.chip img{pointer-events:none}
.chip{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--card);border:1px solid var(--card-b);white-space:nowrap;font-weight:500;font-size:14px;transition:transform .3s,border-color .3s}
.chip img{width:30px;height:30px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}
.chip:hover{transform:translateY(-4px) scale(1.05);border-color:var(--a2)}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.cat{padding:24px}
.cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cat-head h4{font-size:19px}
.cat-head span{font:600 12px var(--hf);color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--card-b)}
.cat::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.cat:hover::after{opacity:1}
.cat:hover{transform:translateY(-6px)}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px 8px;border-radius:16px;background:var(--card);border:1px solid transparent;transition:.3s}
.sk:hover{border-color:var(--card-b);background:rgba(var(--a1-rgb),.08)}
.dial{position:relative;width:76px;height:76px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:5;stroke-linecap:round}
.dial .trk{stroke:var(--card-b)}
.dial .val{stroke:url(#rg);stroke-dasharray:213.6;stroke-dashoffset:213.6;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.dial img{position:absolute;inset:17px;width:42px;height:42px;border-radius:50%;background:#fff;padding:7px;object-fit:contain;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.sk:hover .dial img{transform:scale(1.15) rotate(-12deg)}
.dial b{position:absolute;right:-4px;bottom:-2px;font:700 11px var(--hf);padding:2px 7px;border-radius:999px;background:var(--grad);color:#fff;opacity:0;transform:scale(.6);transition:.4s}
.dial.go b{opacity:1;transform:none}
.sk h5{font:500 13px/1.3 var(--bf)}
@media(max-width:1000px){.bento{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.bento{grid-template-columns:1fr}}

/* ---------- projects ---------- */
.proj{display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center;margin-bottom:64px;cursor:pointer}
.proj:last-child{margin-bottom:0}
.proj:nth-child(even) .proj-media{order:2}
.proj-media{position:relative}
.proj-media::before{content:"";position:absolute;inset:8% 6%;background:var(--grad);filter:blur(60px);opacity:.25;transition:opacity .5s;z-index:-1}
.proj:hover .proj-media::before{opacity:.5}
.media{position:relative;aspect-ratio:16/10;border-radius:24px;overflow:hidden;border:1px solid var(--card-b);background:var(--bg2);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.media .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.media img{position:relative;width:100%;height:100%;object-fit:contain;padding:6%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.proj:hover .media{transform:translateY(-6px)}
.proj:hover .media img{transform:scale(1.06)}
.proj-num{position:absolute;top:14px;left:16px;z-index:1;font:700 13px var(--hf);padding:5px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--card-b)}
.proj-body h4{font-size:clamp(24px,3vw,36px);margin-bottom:12px}
.proj-body p{color:var(--muted);font-size:16px;margin-bottom:18px}
.proj-body .tags{margin-bottom:24px}
.more{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--text)}
.more i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--card-b);transition:.4s}
.more svg{width:18px}
.proj:hover .more i{background:var(--grad);border-color:transparent;color:#fff;transform:rotate(45deg)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:12px;padding:5px 12px;border-radius:999px;background:rgba(var(--a1-rgb),.12);color:color-mix(in srgb,var(--a1) 45%,#fff);border:1px solid rgba(var(--a1-rgb),.25)}
[data-theme="light"] .tags span{color:color-mix(in srgb,var(--a1) 70%,#000)}
@media(max-width:900px){.proj{grid-template-columns:1fr;gap:20px;margin-bottom:44px}.proj:nth-child(even) .proj-media{order:0}}

/* ---------- project drawer ---------- */
.backdrop{position:fixed;inset:0;z-index:200;background:rgba(5,5,10,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(580px,calc(100% - 24px));z-index:201;background:var(--bg2);border:1px solid var(--card-b);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 30px));transition:transform .6s cubic-bezier(.7,0,.2,1);box-shadow:-30px 0 80px -30px rgba(0,0,0,.7)}
.drawer.open{transform:none}
.d-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.d-hero{position:relative;height:260px;overflow:hidden}
.d-hero .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.6}
.d-hero img{position:relative;width:100%;height:100%;object-fit:contain;padding:18px 18px 70px;transform:scale(1.15);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.drawer.open .d-hero img{transform:none}
.d-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg2) 5%,rgba(0,0,0,.15) 60%,transparent)}
.d-title{position:absolute;left:28px;right:28px;bottom:18px;z-index:1}
.d-title small{font:600 12px var(--hf);letter-spacing:.2em;color:var(--a2)}
.d-title h3{font-size:30px;margin-top:4px}
.d-close{position:absolute;top:16px;right:16px;z-index:2}
.d-body{padding:10px 28px 28px}
.d-body>p{color:var(--muted);margin-bottom:16px}
.d-body h5{font:600 12px var(--bf);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 14px}
.d-list{list-style:none;display:grid;gap:10px;counter-reset:n}
.d-list li{counter-increment:n;display:flex;gap:14px;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--card-b);font-size:14.5px;opacity:0;transform:translateX(30px);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.25s + var(--i)*.06s)}
.d-list li::before{content:counter(n,decimal-leading-zero);font:700 13px var(--hf);color:var(--a2);flex-shrink:0;padding-top:1px}
.drawer.open .d-list li{opacity:1;transform:none}
.d-foot{display:flex;gap:10px;align-items:center;padding:16px 20px;border-top:1px solid var(--card-b)}
.d-foot .btn{flex:1;justify-content:center}

/* ---------- blogs: bento ---------- */
.blogs{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto;gap:20px}
.blog{padding:0;display:flex;flex-direction:column}
.blog:first-child{grid-row:span 2}
.blog .thumb{overflow:hidden;aspect-ratio:16/10;position:relative}
.blog:first-child .thumb{aspect-ratio:16/9}
.blog:first-child .info{flex:1;align-items:flex-end}
.blog .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.blog:hover .thumb img{transform:scale(1.08)}
.blog .info{padding:22px 24px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.blog .src{overflow-wrap:anywhere;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--a3);margin-bottom:8px}
.blog h4{font-size:19px;margin-bottom:8px}
.blog:first-child h4{font-size:24px}
.blog p{color:var(--muted);font-size:14.5px}
.blog .go{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--card-b);display:grid;place-items:center;transition:.4s}
.blog .go svg{width:18px}
.blog:hover .go{background:var(--grad);color:#fff;border-color:transparent;transform:rotate(45deg)}
.blog:hover{transform:translateY(-6px)}
.blog:not(:first-child){flex-direction:row}
.blog:not(:first-child) .thumb{width:38%;aspect-ratio:auto;flex-shrink:0}
.blog:not(:first-child) .info{flex-direction:column-reverse;gap:10px}
.blog:not(:first-child) .go{align-self:flex-end;width:38px;height:38px}
@media(max-width:900px){.blogs{grid-template-columns:1fr;grid-template-rows:none}.blog:first-child{grid-row:auto}.blog:not(:first-child){flex-direction:column}.blog:not(:first-child) .thumb{width:100%;aspect-ratio:16/10}}

/* ---------- recognition: holo certificates + trophy bento ---------- */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rot{to{--ang:360deg}}
.sub-label{display:flex;align-items:center;gap:14px;font:600 13px var(--hf);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.sub-label::after{content:"";flex:1;height:1px;background:var(--card-b)}
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.certs>div{display:flex}.holo{display:block;width:100%;border-radius:24px;padding:1.5px;background:conic-gradient(from var(--ang),var(--a1),var(--a2),var(--a3),var(--a4),var(--a1));animation:rot 6s linear infinite;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .4s;box-shadow:0 20px 50px -30px rgba(var(--a1-rgb),.7)}
.holo:hover{box-shadow:0 30px 70px -25px rgba(var(--a2-rgb),.55)}
.holo-in{position:relative;height:100%;border-radius:23px;background:var(--bg2);padding:30px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;overflow:hidden}
.holo-in::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(var(--a2-rgb),.16) 44%,rgba(var(--a3-rgb),.16) 52%,rgba(var(--a3-rgb),.12) 58%,transparent 72%);background-size:260% 260%;background-position:var(--gx,50%) var(--gy,50%);mix-blend-mode:screen;opacity:.6;transition:opacity .3s;pointer-events:none}
.holo-in::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.16),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.holo:hover .holo-in::before,.holo:hover .holo-in::after{opacity:1}
.verified{font:700 10.5px var(--hf);letter-spacing:.18em;color:#22c55e;padding:4px 10px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.seal{position:relative;width:104px;height:104px;margin:4px 0 2px}
.seal img{width:100%;height:100%;border-radius:50%;object-fit:cover;position:relative;z-index:1;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.seal::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed rgba(var(--a1-rgb),.5);animation:spin 18s linear infinite}
.holo:hover .seal img{transform:rotateY(360deg)}
.holo-in p{font:600 15.5px/1.45 var(--hf);flex:1}
.cred{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--card-b);transition:.3s}
.cred svg{width:14px}
.holo:hover .cred{background:var(--grad);color:#fff;border-color:transparent}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tro{position:relative;padding:24px;display:flex;flex-direction:column;overflow:hidden}
.tro.wide{grid-column:span 2}
.tro{min-height:180px}
.bigyr{position:absolute;top:14px;right:24px;font:700 clamp(44px,5vw,72px)/1 var(--hf);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px rgba(var(--a1-rgb),.45);transition:transform .8s cubic-bezier(.2,.8,.2,1),-webkit-text-stroke-color .4s;pointer-events:none}
.tro:hover .bigyr{transform:translateX(-10px);-webkit-text-stroke-color:rgba(var(--a2-rgb),.7)}
.tro.wide .yr{display:none}
.tro .emo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:27px;background:linear-gradient(135deg,rgba(var(--a1-rgb),.25),rgba(var(--a2-rgb),.18));border:1px solid var(--card-b);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.tro:hover .emo{transform:rotate(-12deg) scale(1.15)}
.tro .ghost{position:absolute;right:-18px;bottom:-34px;font-size:150px;line-height:1;opacity:.07;transform:rotate(-18deg);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .5s;pointer-events:none;filter:grayscale(1)}
.tro:hover .ghost{transform:rotate(0) scale(1.12) translateY(-10px);opacity:.14}
.tro .yr{position:absolute;top:22px;right:22px;font:600 12px var(--hf);padding:4px 11px;border-radius:999px;border:1px solid var(--card-b);color:var(--muted);background:var(--card)}
.tro h5{font-size:18px;margin:auto 0 6px;padding-top:22px;position:relative}
.tro p{color:var(--muted);font-size:14px;position:relative}
.tro:hover{transform:translateY(-6px)}
@media(max-width:1000px){.certs{grid-template-columns:1fr 1fr}.trophies{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.certs,.trophies{grid-template-columns:1fr;gap:14px}.tro.wide{grid-column:auto}.bigyr{display:none}.tro.wide .yr{display:block}.tro{min-height:0}.holo{transform:none}}

/* ---------- hobbies ---------- */
.hobbies{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hobby{position:relative;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;border:1px solid var(--card-b)}
.hobby img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1),filter .6s;filter:grayscale(.4)}
.hobby:hover img{transform:scale(1.1);filter:none}
.hobby .ov{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%);color:#fff}
.hobby h4{font-size:26px}
.hobby p{font-size:14px;opacity:.85;max-height:0;overflow:hidden;transition:max-height .6s,margin .6s}
.hobby:hover p{max-height:120px;margin-top:8px}
@media(max-width:900px){.hobbies{grid-template-columns:1fr}.hobby{aspect-ratio:4/3}.hobby p{max-height:120px;margin-top:8px}}

/* ---------- contact & footer ---------- */
.cta{text-align:center;padding:72px 28px;border-radius:32px}
.cta::after{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:var(--grad);filter:blur(140px);opacity:.22;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1}
.cta h2{font-size:clamp(30px,5vw,60px);margin-bottom:18px}
.cta p{color:var(--muted);max-width:640px;margin:0 auto 30px;font-size:16.5px}
.cta .hero-ctas,.cta .socials{justify-content:center}
.contact-meta{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:32px;color:var(--muted);font-size:15px}
.contact-meta span{display:flex;align-items:center;gap:8px}
.contact-meta svg{width:18px;color:var(--a2)}
footer{padding:36px 0 120px;border-top:1px solid var(--card-b);color:var(--muted);font-size:14px}
footer .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
#skills{overflow:hidden}
@media(max-width:640px){
  section{padding:56px 0}
  .sec-head{margin-bottom:28px}
  .sec-tag{font-size:11px;letter-spacing:.2em}
  .card{padding:20px;border-radius:18px}
  .about-text p{font-size:15.5px}
  .stats{gap:12px}
  .services{gap:14px;margin-top:28px}
  .timeline{padding-left:28px}
  .tl-line{left:6px}
  .tl-dot{left:-29px;top:26px;width:16px;height:16px}
  .tl-head h4{font-size:17px}
  .tl-date{font-size:12px;padding:4px 10px}
  .tl-body li{font-size:14px}
  .logo-rows{margin-bottom:30px;gap:10px}
  .mq-group{gap:10px;padding-right:10px}
  .chip{font-size:13px;padding:6px 14px 6px 6px}.chip img{width:26px;height:26px}
  .cat{padding:18px}
  .sk-grid{gap:10px}
  .proj-body p{font-size:15px}
  .blog .info{padding:18px}
  .hobbies{gap:14px}
  .cta{padding:46px 18px;border-radius:24px}
  .cta p{font-size:15px}
  .contact-meta{flex-direction:column;align-items:center;gap:10px;font-size:14px}
  .hero-ctas .btn{padding:12px 20px;font-size:14px}
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;height:90vh;height:90svh;border-radius:24px 24px 0 0;transform:translateY(105%)}
  .drawer.open{transform:none}
  .d-hero{height:210px}
  .d-title{left:20px;right:20px}.d-title h3{font-size:24px}
  .d-body{padding:6px 20px 20px}
  .d-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  footer{padding-bottom:100px}
  footer .container{flex-direction:column;text-align:center}
}
.err{padding:140px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>

<script>
const I = {

  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hostOf = u => { try { return new URL(u).hostname.replace('www.',''); } catch { return ''; } };
const pad = n => String(n).padStart(2,'0');
const iconLabel = (src,skills) => { const f=src.split('/').pop().split('.')[0]; const m={oracle:'Oracle',leetcode:'LeetCode',javascript:'JavaScript',python:'Python',java:'Java'};
  return m[f] || (skills.find(k=>k.icon===src)||{}).name || f.charAt(0).toUpperCase()+f.slice(1); };
const achIcon = t => /chess/i.test(t)?'♟️':/speak|session|talk|workshop/i.test(t)?'🎤':/rank|universit|gpa/i.test(t)?'🎓':/ceo|appreciation|award/i.test(t)?'🏅':/code|hack|athon|performer/i.test(t)?'💻':/club|organi[sz]|fun@|event/i.test(t)?'🎉':'🏆';
const canHover = matchMedia('(hover:hover)').matches;

/* theme */
/* ---------- theme (dark / light) + accent palettes ----------
   a1-a4 = accent colours; dark/light = page background + card background for each mode */
const PALETTES={
  aurora :{name:'Aurora',  a:['#8b5cf6','#ec4899','#06b6d4','#facc15'], dark:['#07070c','#0f0f1a'], light:['#f7f6fb','#ffffff']},
  ocean  :{name:'Ocean',   a:['#3b82f6','#06b6d4','#10b981','#a5f3fc'], dark:['#050a14','#0b1322'], light:['#f3f7fc','#ffffff']},
  sunset :{name:'Sunset',  a:['#f97316','#ef4444','#eab308','#fb7185'], dark:['#0d0806','#1a100c'], light:['#fdf8f4','#ffffff']},
  emerald:{name:'Emerald', a:['#10b981','#14b8a6','#84cc16','#facc15'], dark:['#04100b','#0a1a14'], light:['#f3faf6','#ffffff']},
  royal  :{name:'Royal',   a:['#6366f1','#8b5cf6','#c084fc','#f0abfc'], dark:['#07071a','#0f0f26'], light:['#f5f5fe','#ffffff']},
  rose   :{name:'Rose',    a:['#f43f5e','#ec4899','#f59e0b','#fda4af'], dark:['#0e060a','#1a0d13'], light:['#fdf5f7','#ffffff']},
  cyber  :{name:'Cyber',   a:['#22d3ee','#a3e635','#e879f9','#facc15'], dark:['#04090b','#0a1316'], light:['#f2fafb','#ffffff']},
  slate  :{name:'Slate',   a:['#64748b','#0ea5e9','#94a3b8','#38bdf8'], dark:['#080a0d','#11151b'], light:['#f5f7fa','#ffffff']}
};
const themeBtn=document.getElementById('themeBtn'), lookPanel=document.getElementById('lookPanel');
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
const DEFAULT_PALETTE='slate';   // change to any key in PALETTES
let look={mode:'dark',palette:DEFAULT_PALETTE};
try{ look.mode=localStorage.getItem('theme')||'dark'; look.palette=localStorage.getItem('palette')||DEFAULT_PALETTE; }catch(e){}
if(!PALETTES[look.palette]) look.palette=DEFAULT_PALETTE;
function applyLook(){
  const root=document.documentElement, p=PALETTES[look.palette], [bg,bg2]=p[look.mode];
  root.dataset.theme=look.mode;
  p.a.forEach((c,i)=>root.style.setProperty('--a'+(i+1),c));
  [0,1,2].forEach(i=>root.style.setProperty(`--a${i+1}-rgb`,hexRgb(p.a[i])));
  root.style.setProperty('--bg',bg); root.style.setProperty('--bg2',bg2);
  themeBtn.innerHTML=look.mode==='dark'?I.sun:I.moon;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===look.mode));
  document.querySelectorAll('#swatches .sw').forEach(b=>b.classList.toggle('on',b.dataset.p===look.palette));
  document.getElementById('lookNow').innerHTML=`Current: <b>${p.name}</b> · <b>${look.mode==='dark'?'Dark':'Light'}</b>`;
  try{ localStorage.setItem('theme',look.mode); localStorage.setItem('palette',look.palette); }catch(e){}
}
document.getElementById('modeSeg').innerHTML=`<button data-mode="dark">${I.moon}Dark</button><button data-mode="light">${I.sun}Light</button>`;
document.getElementById('swatches').innerHTML=Object.entries(PALETTES).map(([k,p])=>`<button class="sw" data-p="${k}" title="${p.name}"><i style="background:conic-gradient(${p.a[0]} 0 33%,${p.a[1]} 0 66%,${p.a[2]} 0)"></i>${p.name}</button>`).join('');
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{look.mode=b.dataset.mode;applyLook();});
document.querySelectorAll('#swatches .sw').forEach(b=>b.onclick=()=>{look.palette=b.dataset.p;applyLook();});
const setLookOpen=o=>{lookPanel.classList.toggle('open',o);themeBtn.setAttribute('aria-expanded',o);};
themeBtn.onclick=e=>{e.stopPropagation();setLookOpen(!lookPanel.classList.contains('open'));};
lookPanel.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>setLookOpen(false));
addEventListener('keydown',e=>{if(e.key==='Escape')setLookOpen(false);});
applyLook();

/* Content comes from the data/*.js files loaded in <head> */
if (window.PORTFOLIO && window.PORTFOLIO.meta) render(window.PORTFOLIO);
else {
  document.getElementById('loader').remove();
  document.getElementById('app').innerHTML='<div class="err"><h2>Couldn\'t load the data files</h2><p>Make sure the <code>data</code> folder sits next to index.html, and check the browser console for a typo in one of the data/*.js files.</p></div>';
}

function render(d){
  document.title=d.meta.title;
  document.querySelector('meta[name=description]').content=d.meta.description;
  document.getElementById('logo').innerHTML=`${esc(d.logo)}<b>.</b>`;
  document.getElementById('loaderName').textContent=d.logo;
  const s=d.social;
  const socialHTML=Object.entries(s).map(([k,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${k}">${I[k]||I.arrow}</a>`).join('');
  const words=d.intro.title.split(' ');
  const icons=d.intro.skillIcons;
  const allSkills=d.skills.flatMap(c=>c.skills);
  const half=Math.ceil(allSkills.length/2);
  const chip=k=>`<div class="chip"><img src="${esc(k.icon)}" alt="" draggable="false">${esc(k.name)}</div>`;
  const chips=list=>[0,1].map(n=>`<div class="mq-group"${n?' aria-hidden="true"':''}>${list.map(chip).join('')}</div>`).join('');
  const R=34, C=2*Math.PI*R;

  /* dock */
  const nav=[['home','Home','home'],['about','About','user'],['experience','Experience','brief'],['skills','Skills','layers'],['projects','Projects','folder'],['blogs','Blogs','pen'],['certifications','Certifications','shield'],['achievements','Achievements','trophy'],['hobbies','Hobbies','heart'],['contact','Contact','mail']];
  const MAIN=['home','about','experience','projects'];   // shown in the phone tab bar
  document.getElementById('dock').innerHTML=nav.map(([id,l,ic],i)=>(i===nav.length-1?'<span class="sep"></span>':'')+`<a href="#${id}" data-label="${l}" aria-label="${l}" class="${MAIN.includes(id)?'':'x'}">${I[ic]}<span class="lbl">${l}</span></a>`).join('')
    +`<button class="more" id="moreBtn" aria-label="All sections" aria-expanded="false">${I.grid}<span class="lbl">Menu</span></button>`;
  document.getElementById('menuSheet').innerHTML=nav.map(([id,l,ic])=>`<a href="#${id}">${I[ic]}${l}</a>`).join('');

  document.getElementById('app').innerHTML=`
  <section id="home">
    <div class="container hero">
      <div>
        <div class="eyebrow h-in"><i></i>${esc(d.contact.location)}</div>
        <h1>${words.map((w,i)=>`<span class="word"><span class="${i>=words.length-3?'grad-text':''}">${esc(w)}</span></span>`).join(' ')}</h1>
        <div class="roles h-in"><span class="typed"></span><span class="caret"></span></div>
        <p class="lead h-in">${esc(d.intro.description)}</p>
        <div class="hero-ctas h-in">
          <a href="#projects" class="btn btn-primary">View my work ${I.arrow}</a>
          <a href="#contact" class="btn btn-ghost">Get in touch</a>
        </div>
        <div class="socials h-in">${socialHTML}</div>
        <div class="stack h-in"><span class="stack-label">Core stack</span><div class="stack-icons">${icons.map(src=>`<span class="stack-ic" tabindex="0" data-tip="${esc(iconLabel(src,allSkills))}"><img src="${esc(src)}" alt="${esc(iconLabel(src,allSkills))}"></span>`).join('')}</div></div>
      </div>
      <div class="hero-visual h-pic" id="heroVis">
        <div class="hv-tilt" id="hvTilt">
          <div class="ring"></div>
          <div class="avatar" id="hvAvatar"><img src="${esc(d.intro.profilePic)}" alt="${esc(d.meta.title)}"><span class="glare"></span></div>
        </div>
      </div>
    </div>
  </section>

  <div class="strip"><div class="container strip-in">
    <span class="strip-label">Core strengths</span>
    <div class="strip-view"><div class="strip-track">${[0,1].map(k=>`<div class="strip-group"${k?' aria-hidden="true"':''}>${d.highlights.map(h=>`<span class="pill">${esc(h)}</span>`).join('')}</div>`).join('')}</div></div>
  </div></div>

  <section id="about"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">About me</div><h2>${esc(d.about.title)}</h2></div>
    <div class="about-grid">
      <div class="about-text reveal">${d.about.aboutme.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>
      <div class="stats">
        <div class="card spot stat reveal"><h4 class="grad-text"><span class="count" data-to="7">0</span>+</h4><p>Years of experience</p></div>
        <div class="card spot stat reveal"><h4 class="grad-text"><span class="count" data-to="2000">0</span>+</h4><p>Enterprise customers served</p></div>
        <div class="card spot stat reveal"><h4 class="grad-text">#<span class="count" data-to="3">0</span></h4><p>University Rank (Top 1%)</p></div>
        <div class="card spot stat reveal"><h4 class="grad-text"><span class="count" data-to="30">0</span>%</h4><p>Dev productivity gain via AI agents</p></div>
      </div>
    </div>
    <div class="services">${d.services.map((sv,i)=>`<div class="card spot service reveal"><div class="num">${pad(i+1)}</div><h4>${esc(sv.title)}</h4><p>${esc(sv.description)}</p></div>`).join('')}</div>
  </div></section>

  <section id="experience"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Journey</div><h2>Work & <span class="grad-text">Education</span></h2></div>
    <div class="timeline">
      <div class="tl-line"><i></i></div>
      ${d.experience.map((e,i)=>`
        <div class="tl-item reveal ${i===0?'open':''}">
          <div class="tl-dot"></div>
          <div class="card spot">
            <div class="tl-head"><div><h4>${esc(e.jobtitle)}</h4><div class="tl-where">${esc(e.where)}</div></div><div class="tl-date">${esc(e.date)}</div></div>
            <div class="tl-body"><div><ul>${e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div></div>
            <div class="toggle">Details ${I.down}</div>
          </div>
        </div>`).join('')}
    </div>
  </div></section>

  <section id="skills"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Toolbox</div><h2>Skills & <span class="grad-text">Technologies</span></h2></div>
  </div>
  <div class="logo-rows reveal">
    <div class="mq-view" data-speed="-0.5"><div class="mq-track">${chips(allSkills.slice(0,half))}</div></div>
    <div class="mq-view" data-speed="0.5"><div class="mq-track">${chips(allSkills.slice(half))}</div></div>
  </div>
  <div class="container"><div class="bento">${d.skills.map(c=>`
    <div class="card spot cat reveal">
      <div class="cat-head"><h4>${esc(c.title)}</h4><span>${c.skills.length}</span></div>
      <div class="sk-grid">${c.skills.map(k=>`
        <div class="sk"><div class="dial" data-v="${k.value}">
          <svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="${R}"/><circle class="val" cx="38" cy="38" r="${R}" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)}"/></svg>
          <img src="${esc(k.icon)}" alt=""><b>${k.value}%</b></div>
          <h5>${esc(k.name)}</h5></div>`).join('')}
      </div>
    </div>`).join('')}
  </div></div></section>

  <section id="projects"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Portfolio</div><h2>Selected <span class="grad-text">Projects</span></h2></div>
    <div class="projects">${d.projects.map((p,i)=>`
      <article class="proj" data-i="${i}">
        <div class="proj-media reveal"><div class="media"><div class="blur" style="background-image:url('${esc(p.img)}')"></div><img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy"><span class="proj-num">${pad(i+1)}</span></div></div>
        <div class="proj-body reveal">
          <h4>${esc(p.title)}</h4><p>${esc(p.description)}</p>
          <div class="tags">${p.skills.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
          <span class="more"><i>${I.arrow}</i>View details</span>
        </div>
      </article>`).join('')}</div>
  </div></section>

  <section id="blogs"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Writing</div><h2>Latest <span class="grad-text">Blogs</span></h2></div>
    <div class="blogs">${d.blogs.map(b=>`
      <a class="card spot blog reveal" href="${esc(b.link)}" target="_blank" rel="noopener">
        <div class="thumb"><img src="${esc(b.image)}" alt="" loading="lazy"></div>
        <div class="info"><div><div class="src">${esc(hostOf(b.link))}</div><h4>${esc(b.title)}</h4><p>${esc(b.description)}</p></div><span class="go">${I.arrow}</span></div>
      </a>`).join('')}</div>
  </div></section>

  <section id="certifications"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Credentials</div><h2>Professional <span class="grad-text">Certifications</span></h2></div>
    <div class="certs">${d.certifications.map(c=>`
      <div class="reveal"><a class="holo" href="${esc(c.link)}" target="_blank" rel="noopener"><div class="holo-in">
        <span class="verified">✓ VERIFIED</span>
        <div class="seal"><img src="${esc(c.img)}" alt=""></div>
        <p>${esc(c.description)}</p>
        <span class="cred">View credential ${I.arrow}</span>
      </div></a></div>`).join('')}</div>
  </div></section>

  <section id="achievements"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Milestones</div><h2>Key <span class="grad-text">Achievements</span></h2></div>
    <div class="trophies">${d.achievements.map((a,i)=>{
      const m=a.match(/^(.*?)(?::\s|\s—\s)(.*)$/); let t=m?m[1]:a; const b=m?m[2]:'';
      const y=(a.match(/\((\d{4}(?:\s*[-–]\s*\d{4})?)\)/)||a.match(/\b((?:19|20)\d{2})\b/)||[])[1]||'';
      t=t.replace(/\s*\(\d{4}(?:\s*[-–]\s*\d{4})?\)/,'').trim();
      const e=achIcon(a), wide=(i%6===0||i%6===5)?' wide':'';
      return `<div class="card spot tro reveal${wide}"><span class="ghost">${e}</span><div class="emo">${e}</div>${y?`<span class="yr">${esc(y)}</span>`:''}${y&&wide?`<span class="bigyr">${esc(y.replace(/\s+/g,''))}</span>`:''}<h5>${esc(t)}</h5>${b?`<p>${esc(b)}</p>`:''}</div>`}).join('')}</div>
  </div></section>

  <section id="hobbies"><div class="container">
    <div class="sec-head reveal"><div class="sec-tag">Beyond code</div><h2>Hobbies</h2></div>
    <div class="hobbies">${d.hobbies.map(h=>`<div class="hobby reveal"><img src="${esc(h.image)}" alt="${esc(h.title)}" loading="lazy"><div class="ov"><h4>${esc(h.title)}</h4><p>${esc(h.description)}</p></div></div>`).join('')}</div>
  </div></section>

  <section id="contact"><div class="container">
    <div class="card cta reveal">
      <div class="sec-tag" style="justify-content:center">Hire me</div>
      <h2>${esc(d.hireMe.title)}</h2>
      <p>${esc(d.hireMe.description)}</p>
      <div class="hero-ctas">
        <a href="mailto:${esc(d.contact.email)}" class="btn btn-primary">${I.mail} Email me</a>
        <a href="${esc(s.linkedin)}" target="_blank" rel="noopener" class="btn btn-ghost">${I.linkedin} Connect on LinkedIn</a>
      </div>
      <div class="contact-meta"><span>${I.mail}${esc(d.contact.email)}</span><span>${I.pin}${esc(d.contact.location)}</span></div>
      <div class="socials">${socialHTML}</div>
    </div>
  </div></section>

  <footer><div class="container"><span>© ${new Date().getFullYear()} ${esc(d.meta.title)}</span><span>${esc(d.intro.roles[0])}</span></div></footer>`;

  initTyped(d.intro.roles);
  initHeroVisual();
  initMarquees();
  initProjects(d.projects);
  initInteractions();
  initCursor();
  initAnimations();
}

function initTyped(roles){
  const el=document.querySelector('.typed'); let r=0,c=0,del=false;
  (function tick(){
    const w=roles[r]; el.textContent=w.slice(0,c);
    if(!del&&c===w.length){del=true;return setTimeout(tick,1600);}
    if(del&&c===0){del=false;r=(r+1)%roles.length;}
    c+=del?-1:1; setTimeout(tick,del?35:70);
  })();
}

/* ---------- draggable marquees (highlights strip + skill rows) ----------
   Auto-scrolls, pauses on hover, can be dragged / swiped with momentum, loops endlessly.
   The track must contain two identical groups. speed = px per frame (negative = left). */
function initMarquee(view,speed){
  const track=view.firstElementChild, group=track.firstElementChild;
  let x=0, vel=speed, dragging=false, hover=false, lastX=0, lastT=0, visible=true;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wrap=()=>{const w=group.offsetWidth; if(!w)return; while(x<=-w)x+=w; while(x>0)x-=w;};
  view.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastT=performance.now();vel=0;view.classList.add('dragging');view.setPointerCapture(e.pointerId);});
  view.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=e.clientX-lastX;x+=dx;vel=dx/Math.max(1,(now-lastT)/16.7);lastX=e.clientX;lastT=now;wrap();});
  const end=()=>{if(!dragging)return;dragging=false;view.classList.remove('dragging');};
  view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
  view.addEventListener('mouseenter',()=>hover=true);view.addEventListener('mouseleave',()=>hover=false);
  new IntersectionObserver(([e])=>visible=e.isIntersecting).observe(view);
  (function loop(){
    if(visible&&!dragging){
      const target=reduce||hover?0:speed;            // pause on hover, otherwise drift
      vel+=(target-vel)*.04;                         // momentum after a fling eases back to auto speed
      x+=vel; wrap();
    }
    track.style.transform=`translate3d(${x}px,0,0)`;
    requestAnimationFrame(loop);
  })();
}
function initMarquees(){
  initMarquee(document.querySelector('.strip-view'),-.45);
  document.querySelectorAll('.mq-view').forEach(v=>initMarquee(v,parseFloat(v.dataset.speed)));
}

/* ---------- hero photo: soft light follows the pointer ---------- */
function initHeroVisual(){
  const av=document.getElementById('hvAvatar'); if(!canHover||!av) return;
  av.addEventListener('mousemove',e=>{const r=av.getBoundingClientRect();av.style.setProperty('--gx',(e.clientX-r.left)/r.width*100+'%');av.style.setProperty('--gy',(e.clientY-r.top)/r.height*100+'%');});
}

/* ---------- projects: detail drawer ---------- */
function initProjects(projects){
  const drawer=document.getElementById('drawer'),bd=document.getElementById('backdrop');
  let cur=0;
  function fill(i){
    cur=(i+projects.length)%projects.length; const p=projects[cur];
    drawer.innerHTML=`
      <button class="icon-btn d-close" data-close aria-label="Close">${I.close}</button>
      <div class="d-scroll">
        <div class="d-hero"><div class="blur" style="background-image:url('${esc(p.img)}')"></div><img src="${esc(p.img)}" alt=""><div class="d-title"><small>PROJECT ${pad(cur+1)} / ${pad(projects.length)}</small><h3>${esc(p.title)}</h3></div></div>
        <div class="d-body">
          <p>${esc(p.description)}</p>
          <div class="tags">${p.skills.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
          <h5>Highlights</h5>
          <ol class="d-list">${p.bullets.map((b,j)=>`<li style="--i:${j}">${esc(b)}</li>`).join('')}</ol>
        </div>
      </div>
      <div class="d-foot">
        <button class="icon-btn" data-prev aria-label="Previous">${I.left}</button>
        <a href="${esc(p.link)}" target="_blank" rel="noopener" class="btn btn-primary">Visit project ${I.arrow}</a>
        <button class="icon-btn" data-next aria-label="Next">${I.right}</button>
      </div>`;
    drawer.querySelector('[data-close]').onclick=close;
    drawer.querySelector('[data-prev]').onclick=()=>swap(cur-1);
    drawer.querySelector('[data-next]').onclick=()=>swap(cur+1);
    bindCursorTargets(drawer);
  }
  function swap(i){ drawer.classList.remove('open'); setTimeout(()=>{fill(i);requestAnimationFrame(()=>drawer.classList.add('open'));},350); }
  function open(i){ fill(i); drawer.setAttribute('aria-hidden','false'); bd.classList.add('open'); document.body.style.overflow='hidden'; requestAnimationFrame(()=>requestAnimationFrame(()=>drawer.classList.add('open'))); }
  function close(){ drawer.classList.remove('open'); bd.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  document.querySelectorAll('.proj').forEach(r=>r.onclick=()=>open(+r.dataset.i));
  bd.onclick=close;
  addEventListener('keydown',e=>{ if(!drawer.classList.contains('open'))return; if(e.key==='Escape')close(); if(e.key==='ArrowRight')swap(cur+1); if(e.key==='ArrowLeft')swap(cur-1); });
}

/* ---------- general interactions ---------- */
function initInteractions(){
  document.querySelectorAll('.spot').forEach(el=>el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',e.clientX-r.left+'px');el.style.setProperty('--my',e.clientY-r.top+'px');}));
  document.querySelectorAll('.tl-item').forEach(it=>it.querySelector('.card').onclick=()=>{it.classList.toggle('open');setTimeout(()=>window.ScrollTrigger&&ScrollTrigger.refresh(),550);});

  // holographic certificate tilt + glare
  if(canHover) document.querySelectorAll('.holo').forEach(c=>{
    c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--ry',(x-.5)*14+'deg');c.style.setProperty('--rx',(.5-y)*14+'deg');
      const inner=c.firstElementChild;inner.style.setProperty('--gx',x*100+'%');inner.style.setProperty('--gy',y*100+'%');});
    c.addEventListener('mouseleave',()=>{c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg');});
  });

  // skill dials
  const io=new IntersectionObserver(en=>en.forEach(e=>{ if(!e.isIntersecting)return; const dl=e.target, c=dl.querySelector('.val'), C=parseFloat(c.style.strokeDasharray);
    setTimeout(()=>{c.style.strokeDashoffset=C*(1-dl.dataset.v/100);dl.classList.add('go');},150); io.unobserve(dl); }),{threshold:.4});
  document.querySelectorAll('.dial').forEach(d=>io.observe(d));

  // dock: active section + mac-style magnify
  const dock=document.getElementById('dock'), links=[...dock.querySelectorAll('a')];
  const sheet=document.getElementById('menuSheet'), scrim=document.getElementById('menuScrim'), more=document.getElementById('moreBtn');
  const sheetLinks=[...sheet.querySelectorAll('a')];
  const setMenu=open=>{sheet.classList.toggle('open',open);scrim.classList.toggle('open',open);more.classList.toggle('open',open);more.setAttribute('aria-expanded',open);};
  more.onclick=()=>setMenu(!sheet.classList.contains('open'));
  scrim.onclick=()=>setMenu(false);
  sheetLinks.forEach(a=>a.addEventListener('click',()=>setMenu(false)));
  addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false);});
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  const prog=document.getElementById('progress');
  const onScroll=()=>{
    const h=document.documentElement.scrollHeight-innerHeight; prog.style.transform=`scaleX(${h>0?scrollY/h:0})`;
    let act=0; secs.forEach((s,i)=>{ if(s&&s.getBoundingClientRect().top<innerHeight*.45) act=i; });
    if(innerHeight+scrollY>=document.documentElement.scrollHeight-4) act=secs.length-1;
    links.forEach((a,i)=>a.classList.toggle('active',i===act));
    sheetLinks.forEach((a,i)=>a.classList.toggle('active',i===act));
    more.classList.toggle('active',links[act].classList.contains('x'));
  };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  addEventListener('resize',()=>{links.forEach(a=>a.style.transform='');if(innerWidth>640)setMenu(false);});
  if(canHover){
    dock.addEventListener('mousemove',e=>innerWidth>640&&links.forEach(a=>{const r=a.getBoundingClientRect(),d=Math.abs(e.clientX-(r.left+r.width/2)),s=1+Math.max(0,1-d/110)*.45;a.style.transform=`translateY(${-(s-1)*22}px) scale(${s})`;}));
    dock.addEventListener('mouseleave',()=>links.forEach(a=>a.style.transform=''));
  }
}

/* ---------- cursor ---------- */
var cRing;
function bindCursorTargets(root=document){
  if(!cRing) return;
  root.querySelectorAll('a,button,.stack-ic,.proj,.tl-item .card,.chip,.sk,.hobby,.tro').forEach(el=>{
    if(el._c)return; el._c=1;
    el.addEventListener('mouseenter',()=>cRing.classList.add('hover'));
    el.addEventListener('mouseleave',()=>cRing.classList.remove('hover'));
  });
}
function initCursor(){
  if(!canHover) return;
  cRing=document.getElementById('cRing'); const dot=document.getElementById('cDot');
  let mx=0,my=0,x=0,y=0;
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.transform=`translate(${mx}px,${my}px)`;document.body.classList.add('c-on');});
  document.addEventListener('mouseleave',()=>document.body.classList.remove('c-on'));
  addEventListener('mousedown',()=>cRing.classList.add('down'));
  addEventListener('mouseup',()=>cRing.classList.remove('down'));
  (function loop(){x+=(mx-x)*.18;y+=(my-y)*.18;cRing.style.transform=`translate(${x}px,${y}px)`;requestAnimationFrame(loop);})();
  bindCursorTargets();
}

/* ---------- scroll animations ---------- */
function initAnimations(){
  const loader=document.getElementById('loader');
  if(!window.gsap){ loader.remove(); document.querySelectorAll('.reveal').forEach(e=>{e.style.opacity=1;e.style.transform='none'}); return; }
  gsap.registerPlugin(ScrollTrigger);

  gsap.timeline()
    .to('#loader .l-text span',{y:0,duration:.6,stagger:.08,ease:'power4.out'})
    .to('#loader .bar i',{width:'100%',duration:.6,ease:'power2.inOut'},'-=.3')
    .to('#loader',{yPercent:-100,duration:.8,ease:'power4.inOut'})
    .add(()=>loader.remove())
    .from('.hero h1 .word > span',{yPercent:110,duration:.9,stagger:.08,ease:'power4.out'},'-=.35')
    .from('.h-in',{y:26,opacity:0,duration:.7,stagger:.08,ease:'power3.out'},'-=.6')
    .from('.h-pic',{scale:.7,opacity:0,rotate:-15,duration:1.1,ease:'expo.out'},'-=.9')
    .from('.dock',{y:120,duration:.8,ease:'back.out(1.6)',clearProps:'transform'},'-=.8');

  gsap.to('.hero-visual',{yPercent:18,ease:'none',scrollTrigger:{trigger:'#home',start:'top top',end:'bottom top',scrub:true}});
  gsap.to('.hero > div:first-child',{yPercent:-12,opacity:.3,ease:'none',scrollTrigger:{trigger:'#home',start:'top top',end:'bottom top',scrub:true}});

  ScrollTrigger.batch('.reveal',{start:'top 90%',once:true,onEnter:b=>gsap.to(b,{opacity:1,y:0,duration:.9,stagger:.1,ease:'power3.out',onComplete:()=>b.forEach(el=>{el.classList.remove('reveal');el.style.transform='';el.style.opacity='';})})});

  document.querySelectorAll('.count').forEach(el=>{const o={v:0};
    ScrollTrigger.create({trigger:el,start:'top 90%',once:true,onEnter:()=>gsap.to(o,{v:+el.dataset.to,duration:2,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(o.v).toLocaleString()})});});

  gsap.to('.tl-line i',{scaleY:1,ease:'none',scrollTrigger:{trigger:'.timeline',start:'top 70%',end:'bottom 70%',scrub:true}});
  document.querySelectorAll('.tl-item').forEach(it=>ScrollTrigger.create({trigger:it,start:'top 70%',onEnter:()=>it.classList.add('on'),onLeaveBack:()=>it.classList.remove('on')}));

  // project images open up as they scroll into view
  gsap.utils.toArray('.media').forEach(m=>gsap.fromTo(m,{clipPath:'inset(10% 8% 10% 8% round 24px)'},{clipPath:'inset(0% 0% 0% 0% round 24px)',ease:'none',scrollTrigger:{trigger:m,start:'top 98%',end:'top 55%',scrub:true}}));

  if(innerWidth>900) gsap.utils.toArray('.hobby').forEach((h,i)=>gsap.fromTo(h,{rotate:i%2?4:-4},{rotate:0,ease:'none',scrollTrigger:{trigger:h,start:'top bottom',end:'top 55%',scrub:true}}));
  gsap.to('.blob.b1',{y:400,ease:'none',scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:true}});
  gsap.to('.blob.b2',{y:-400,ease:'none',scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:true}});
  addEventListener('load',()=>ScrollTrigger.refresh());
}
</script>
